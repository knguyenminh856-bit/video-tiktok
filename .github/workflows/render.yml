name: Render HyperFrames Video

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

env:
  HYPERFRAMES_NO_TELEMETRY: "1"

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: Project directory (. for root Neon video, videos/hydrogen-pro for Hydrogen Pro video)
        required: false
        default: videos/hydrogen-pro
        type: choice
        options:
          - videos/hydrogen-pro
          - .
      composition:
        description: Entry HTML composition file
        required: false
        default: index.html
        type: string
      quality:
        description: Render quality preset
        required: false
        default: delivery
        type: choice
        options:
          - delivery
          - looks
          - draft
      fps:
        description: Frame rate (FPS)
        required: false
        default: "30"
        type: choice
        options:
          - "30"
          - "60"
          - "24"
      format:
        description: Output format
        required: false
        default: mp4
        type: choice
        options:
          - mp4
          - webm
          - gif
      output_name:
        description: Output file basename without extension (auto if blank)
        required: false
        default: ""
        type: string
      variables:
        description: 'Optional JSON variables override (e.g. {"headline":"Tiêu đề mới"})'
        required: false
        default: ""
        type: string
      run_check:
        description: Run lint & full composition check before rendering
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - index.html
      - compositions/**
      - assets/**
      - hyperframes.json
      - videos/**
      - .github/workflows/render.yml

jobs:
  render:
    name: Render video on Linux runner
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect target project and output name
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DIR: ${{ inputs.project_dir }}
          INPUT_OUT: ${{ inputs.output_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PROJ_DIR="${INPUT_DIR:-videos/hydrogen-pro}"
          else
            CHANGED="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)"
            VID_DIR="$(echo "$CHANGED" | sed -n 's|^videos/\([^/]*\)/.*|videos/\1|p' | head -n 1)"
            if [ -n "$VID_DIR" ] && [ -f "$VID_DIR/index.html" ]; then
              PROJ_DIR="$VID_DIR"
            else
              PROJ_DIR="."
            fi
          fi

          if [ -n "$INPUT_OUT" ]; then
            OUT_NAME="$INPUT_OUT"
          elif [ "$PROJ_DIR" = "." ]; then
            OUT_NAME="neon-deal-tiktok"
          else
            OUT_NAME="$(basename "$PROJ_DIR")-tiktok"
          fi

          echo "project_dir=$PROJ_DIR" >> "$GITHUB_OUTPUT"
          echo "output_name=$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved project_dir=$PROJ_DIR, output_name=$OUT_NAME"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-liberation \
            fonts-noto-core \
            fonts-noto-color-emoji
          sudo fc-cache -f

      - name: Install project dependencies
        run: npm ci

      - name: Cache HyperFrames browser and font cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/hyperframes
          key: hyperframes-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            hyperframes-cache-${{ runner.os }}-

      - name: Ensure pinned Chromium browser
        run: npx hyperframes browser ensure

      - name: Check environment with doctor
        run: npx hyperframes doctor || true

      - name: Validate composition (lint + check)
        if: ${{ github.event_name == 'push' || inputs.run_check }}
        env:
          PROJ_DIR: ${{ steps.target.outputs.project_dir }}
        run: |
          npx hyperframes lint "$PROJ_DIR"
          npx hyperframes check "$PROJ_DIR" --json

      - name: Capture preview snapshots
        env:
          PROJ_DIR: ${{ steps.target.outputs.project_dir }}
        run: npx hyperframes snapshot "$PROJ_DIR" --at 0,3,6 || true

      - name: Render video
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROJ_DIR: ${{ steps.target.outputs.project_dir }}
          OUT_NAME: ${{ steps.target.outputs.output_name }}
          INPUT_COMP: ${{ inputs.composition }}
          INPUT_QUALITY: ${{ inputs.quality }}
          INPUT_FPS: ${{ inputs.fps }}
          INPUT_FORMAT: ${{ inputs.format }}
          INPUT_VARIABLES: ${{ inputs.variables }}
        run: |
          set -euo pipefail
          COMP="${INPUT_COMP:-index.html}"
          if [ "$EVENT_NAME" = "push" ]; then
            QUALITY="${INPUT_QUALITY:-looks}"
          else
            QUALITY="${INPUT_QUALITY:-delivery}"
          fi
          FPS="${INPUT_FPS:-30}"
          FORMAT="${INPUT_FORMAT:-mp4}"
          OUT_PATH="${GITHUB_WORKSPACE}/renders/${OUT_NAME}.${FORMAT}"

          mkdir -p "${GITHUB_WORKSPACE}/renders"

          ARGS=("$PROJ_DIR" -c "$COMP" --quality "$QUALITY" --fps "$FPS" --format "$FORMAT" -o "$OUT_PATH")
          if [ -n "$INPUT_VARIABLES" ]; then
            ARGS+=(--variables "$INPUT_VARIABLES")
          fi

          echo "Running: npx hyperframes render ${ARGS[*]}"
          npx hyperframes render "${ARGS[@]}"

          {
            echo "## HyperFrames Cloud Render"
            echo ""
            echo "- **Project Dir:** \`$PROJ_DIR\` | **Composition:** \`$COMP\`"
            echo "- **Output:** \`renders/${OUT_NAME}.${FORMAT}\`"
            echo "- **Quality:** \`$QUALITY\` | **FPS:** \`$FPS\` | **Format:** \`$FORMAT\`"
            echo "- **File size:** $(ls -lh "$OUT_PATH" | awk '{print $5}')"
            if [ "$FORMAT" = "mp4" ] || [ "$FORMAT" = "webm" ]; then
              echo ""
              echo "### Stream Info (ffprobe)"
              echo '```json'
              ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,duration -of json "$OUT_PATH"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish direct MP4 download (GitHub Release)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_NAME: ${{ steps.target.outputs.output_name }}
          INPUT_FORMAT: ${{ inputs.format }}
        run: |
          set -euo pipefail
          FORMAT="${INPUT_FORMAT:-mp4}"
          FILE="${GITHUB_WORKSPACE}/renders/${OUT_NAME}.${FORMAT}"
          TAG="latest-render"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "Latest Rendered Video" \
              --notes "Auto-rendered by HyperFrames GitHub Actions."
          fi

          DL_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${OUT_NAME}.${FORMAT}"
          echo "- **Direct Download:** [$OUT_NAME.$FORMAT]($DL_URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rendered video artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.output_name }}-${{ github.run_number }}
          path: renders/*
          retention-days: 14

      - name: Upload preview snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.run_number }}
          path: ${{ steps.target.outputs.project_dir }}/.hyperframes/artifacts/snapshots/**
          retention-days: 7
          if-no-files-found: ignore
