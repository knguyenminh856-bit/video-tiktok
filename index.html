<!doctype html>
<html
  lang="vi"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#09090B"},
    {"id":"color-ink","type":"color","label":"Primary Ink","default":"#FAFAF9"},
    {"id":"color-accent","type":"color","label":"Neon Volt Accent","default":"#D9F99D"},
    {"id":"color-danger","type":"color","label":"Warning Crimson","default":"#FF3B5C"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: var(--color-ground, #09090b);
        --ink: var(--color-ink, #fafaf9);
        --accent: var(--color-accent, #d9f99d);
        --danger: var(--color-danger, #ff3b5c);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      .clip {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>

    <script>
      window.__tailwindReady = new Promise(function (resolve) {
        var loaded = document.readyState === "complete";
        var resolved = false;
        var observer;
        function readTailwindCss() {
          var styles = document.querySelectorAll("style");
          for (var i = styles.length - 1; i >= 0; i--) {
            var text = styles[i].textContent || "";
            if (text.indexOf("tailwindcss v") !== -1) return text;
          }
          return "";
        }
        function finish() {
          if (resolved || !loaded || !readTailwindCss()) return;
          resolved = true;
          if (observer) observer.disconnect();
          resolve(true);
        }
        observer = new MutationObserver(finish);
        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
          characterData: true,
        });
        if (loaded) {
          finish();
        } else {
          window.addEventListener(
            "load",
            function () {
              loaded = true;
              finish();
            },
            { once: true },
          );
        }
      });
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.2.4/dist/index.global.js"
      integrity="sha384-v5YF9xS+gLRWdvrQ0u/WRbCkjSIH0NjHIPe8tBL1ZRrmI7PiSH6LLdzs0aAIMCuh"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="s1-hook"
        class="clip"
        data-composition-id="s1-hook"
        data-composition-src="compositions/s1-hook.html"
        data-start="0"
        data-duration="3.4"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="s2-price-slash"
        class="clip"
        data-composition-id="s2-price-slash"
        data-composition-src="compositions/s2-price-slash.html"
        data-start="3.4"
        data-duration="4.4"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="s3-verdict"
        class="clip"
        data-composition-id="s3-verdict"
        data-composition-src="compositions/s3-verdict.html"
        data-start="7.8"
        data-duration="3.0"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="s4-perks-core"
        class="clip"
        data-composition-id="s4-perks-core"
        data-composition-src="compositions/s4-perks-core.html"
        data-start="10.8"
        data-duration="5.0"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="s5-perks-create"
        class="clip"
        data-composition-id="s5-perks-create"
        data-composition-src="compositions/s5-perks-create.html"
        data-start="15.8"
        data-duration="5.0"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="s6-warnings"
        class="clip"
        data-composition-id="s6-warnings"
        data-composition-src="compositions/s6-warnings.html"
        data-start="20.8"

        data-track-index="0"
        data-track-kind="graphics"

      <div
        id="s7-cta"
        class="clip"
        data-composition-id="s7-cta"
        data-composition-src="compositions/s7-cta.html"
        data-start="26.0"
        data-duration="4.0"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="progress-bar"
        class="clip"
        data-composition-id="progress-bar"
        data-composition-src="compositions/progress-bar.html"
        data-start="0"
        data-duration="30"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        data-layout-ignore
      ></div>

      <!-- SFX Track A (Lane 2): transitions, hook/slash impacts, sequential card cues -->
      <audio id="sfx-hook-hit" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0.00" data-duration="1.80" data-volume="0.42" data-fade-out="0.35" data-track-index="2"></audio>
      <audio id="sfx-cut-1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="3.24" data-duration="0.57" data-volume="0.72" data-track-index="2"></audio>
      <audio id="sfx-slash" class="clip" src="assets/sfx/whoosh.mp3" data-start="4.22" data-duration="0.57" data-volume="0.85" data-track-index="2"></audio>
      <audio id="sfx-cut-2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="7.64" data-duration="0.57" data-volume="0.72" data-track-index="2"></audio>
      <audio id="sfx-cut-3" class="clip" src="assets/sfx/whoosh.mp3" data-start="10.64" data-duration="0.57" data-volume="0.70" data-track-index="2"></audio>
      <audio id="sfx-perk2-click" class="clip" src="assets/sfx/click.mp3" data-start="11.55" data-duration="0.36" data-volume="0.95" data-track-index="2"></audio>
      <audio id="sfx-perk3-pop" class="clip" src="assets/sfx/pop.mp3" data-start="12.15" data-duration="0.70" data-volume="0.85" data-track-index="2"></audio>
      <audio id="sfx-cut-4" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="15.64" data-duration="0.57" data-volume="0.70" data-track-index="2"></audio>
      <audio id="sfx-credits-sparkle" class="clip" src="assets/sfx/sparkle.mp3" data-start="16.25" data-duration="1.50" data-volume="0.42" data-fade-out="0.30" data-track-index="2"></audio>
      <audio id="sfx-cut-5" class="clip" src="assets/sfx/whoosh.mp3" data-start="20.64" data-duration="0.57" data-volume="0.72" data-track-index="2"></audio>
      <audio id="sfx-warn2-click" class="clip" src="assets/sfx/click.mp3" data-start="21.65" data-duration="0.36" data-volume="0.95" data-track-index="2"></audio>
      <audio id="sfx-warn3-click" class="clip" src="assets/sfx/click-soft.mp3" data-start="22.30" data-duration="0.36" data-volume="0.95" data-track-index="2"></audio>
      <audio id="sfx-cut-6" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="25.84" data-duration="0.57" data-volume="0.72" data-track-index="2"></audio>
      <audio id="sfx-cta-chime" class="clip" src="assets/sfx/chime.mp3" data-start="26.50" data-media-start="0.30" data-duration="2.10" data-volume="1.15" data-fade-out="0.50" data-track-index="2"></audio>

      <!-- SFX Track B (Lane 3): overlapping beats & hits -->
      <audio id="sfx-price-slam" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="3.40" data-media-start="0.52" data-duration="2.00" data-volume="0.42" data-fade-in="0.20" data-fade-out="0.40" data-track-index="3"></audio>
      <audio id="sfx-verdict-ping" class="clip" src="assets/sfx/ping.mp3" data-start="7.80" data-media-start="0.25" data-duration="1.05" data-volume="0.80" data-fade-out="0.25" data-track-index="3"></audio>
      <audio id="sfx-perk1-pop" class="clip" src="assets/sfx/pop.mp3" data-start="10.95" data-duration="0.70" data-volume="0.85" data-track-index="3"></audio>
      <audio id="sfx-flow-click" class="clip" src="assets/sfx/click-soft.mp3" data-start="15.95" data-duration="0.36" data-volume="0.95" data-track-index="3"></audio>
      <audio id="sfx-notebook-click" class="clip" src="assets/sfx/click.mp3" data-start="16.55" data-duration="0.36" data-volume="0.95" data-track-index="3"></audio>
      <audio id="sfx-more-pop" class="clip" src="assets/sfx/pop.mp3" data-start="17.15" data-duration="0.70" data-volume="0.85" data-track-index="3"></audio>
      <audio id="sfx-warn-drop" class="clip" src="assets/sfx/error.mp3" data-start="20.80" data-media-start="0.50" data-duration="1.10" data-volume="1.60" data-fade-out="0.25" data-track-index="3"></audio>
      <audio id="sfx-cta-hit" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="26.00" data-duration="1.80" data-volume="0.40" data-fade-out="0.40" data-track-index="3"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
