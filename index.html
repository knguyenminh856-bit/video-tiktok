<!doctype html>
<html
  lang="vi"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#09090B"},
    {"id":"color-ink","type":"color","label":"Primary Ink","default":"#FAFAF9"},
    {"id":"color-accent","type":"color","label":"Neon Volt Accent","default":"#D9F99D"},
    {"id":"color-danger","type":"color","label":"Warning Crimson","default":"#FF3B5C"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: var(--color-ground, #09090b);
        --ink: var(--color-ink, #fafaf9);
        --accent: var(--color-accent, #d9f99d);
        --danger: var(--color-danger, #ff3b5c);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      .clip {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>

    <script>
      window.__tailwindReady = new Promise(function (resolve) {
        var loaded = document.readyState === "complete";
        var resolved = false;
        var observer;
        function readTailwindCss() {
          var styles = document.querySelectorAll("style");
          for (var i = styles.length - 1; i >= 0; i--) {
            var text = styles[i].textContent || "";
            if (text.indexOf("tailwindcss v") !== -1) return text;
          }
          return "";
        }
        function finish() {
          if (resolved || !loaded || !readTailwindCss()) return;
          resolved = true;
          if (observer) observer.disconnect();
          resolve(true);
        }
        observer = new MutationObserver(finish);
        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
          characterData: true,
        });
        if (loaded) {
          finish();
        } else {
          window.addEventListener(
            "load",
            function () {
              loaded = true;
              finish();
            },
            { once: true },
          );
        }
      });
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.2.4/dist/index.global.js"
      integrity="sha384-v5YF9xS+gLRWdvrQ0u/WRbCkjSIH0NjHIPe8tBL1ZRrmI7PiSH6LLdzs0aAIMCuh"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="s1-hook"
        class="clip"
        data-composition-id="s1-hook"
        data-composition-src="compositions/s1-hook.html"
        data-start="0"
        data-duration="3.4"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="s2-price-slash"
        class="clip"
        data-composition-id="s2-price-slash"
        data-composition-src="compositions/s2-price-slash.html"
        data-start="3.4"
        data-duration="4.4"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="s3-verdict"
        class="clip"
        data-composition-id="s3-verdict"
        data-composition-src="compositions/s3-verdict.html"
        data-start="7.8"
        data-duration="3.0"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="s4-perks-core"
        class="clip"
        data-composition-id="s4-perks-core"
        data-composition-src="compositions/s4-perks-core.html"
        data-start="10.8"
        data-duration="5.0"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="s5-perks-create"
        class="clip"
        data-composition-id="s5-perks-create"
        data-composition-src="compositions/s5-perks-create.html"
        data-start="15.8"
        data-duration="5.0"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="s6-warnings"
        class="clip"
        data-composition-id="s6-warnings"
        data-composition-src="compositions/s6-warnings.html"
        data-start="20.8"
        data-duration="5.2"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="s7-cta"
        class="clip"
        data-composition-id="s7-cta"
        data-composition-src="compositions/s7-cta.html"
        data-start="26.0"
        data-duration="4.0"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="progress-bar"
        class="clip"
        data-composition-id="progress-bar"
        data-composition-src="compositions/progress-bar.html"
        data-start="0"
        data-duration="30"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        data-layout-ignore
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
