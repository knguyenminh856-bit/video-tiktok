    <style>
      :root {
        --ground: var(--color-ground, #09090b);
        --ink: var(--color-ink, #fafaf9);
        --accent: var(--color-accent, #d9f99d);
        --danger: var(--color-danger, #ff3b5c);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      .clip {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>

    <script>
      window.__tailwindReady = new Promise(function (resolve) {
        var loaded = document.readyState === "complete";
        var resolved = false;
        var observer;
        function readTailwindCss() {
          var styles = document.querySelectorAll("style");
          for (var i = styles.length - 1; i >= 0; i--) {
            var text = styles[i].textContent || "";
            if (text.indexOf("tailwindcss v") !== -1) return text;
          }
          return "";
        }
        function finish() {
          if (resolved || !loaded || !readTailwindCss()) return;
          resolved = true;
          if (observer) observer.disconnect();
          resolve(true);
        }
        observer = new MutationObserver(finish);
        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
          characterData: true,
        });
        if (loaded) {
          finish();
        } else {
          window.addEventListener(
            "load",
            function () {
              loaded = true;
              finish();
            },
            { once: true },
          );
        }
      });
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.2.4/dist/index.global.js"

      crossorigin="anonymous"
    ></script>
  </head>
